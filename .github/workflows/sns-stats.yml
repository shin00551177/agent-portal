name: SNS Video Stats Sync

on:
  schedule:
    # 毎朝9時（JST）= UTC 0:00 に全アクティブアプリのYouTube動画データを取得
    - cron: "0 0 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync YouTube video stats for all active apps
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAL_URL }}/api/cron/sns-stats" | jq .
